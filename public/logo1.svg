<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <!-- 
    The mix-blend-mode: multiply creates the distinct overlapping 
    darker colors at the corners of the play button 
  -->
  <g style="mix-blend-mode: multiply;">
    <!-- Top Edge (Soft Pink to match UI accents) -->
    <path d="M 40,32 L 72,50" stroke="#ff477e" stroke-width="18" stroke-linecap="round" />
    
    <!-- Bottom Edge (Blue-Green/Cyan) -->
    <path d="M 40,68 L 72,50" stroke="#00d2ff" stroke-width="18" stroke-linecap="round" />
    
    <!-- Left Edge (Deep Blue) -->
    <path d="M 40,32 L 40,68" stroke="#3b82f6" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Typography matching the dashboard -->
  <text x="105" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="-0.5px">
    Lumiere <tspan y="64" font-weight="700" font-size="34" fill="#ff0066">AI</tspan>
  </text>
</svg>
