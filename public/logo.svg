<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <!-- 
    The mix-blend-mode: multiply creates the distinct overlapping 
    darker colors at the corners of the play button 
  -->
  <g style="mix-blend-mode: multiply;">
    <!-- Top Edge (Amber/Yellow) -->
    <path d="M 40,32 L 72,50" stroke="#F5A623" stroke-width="18" stroke-linecap="round" />
    
    <!-- Bottom Edge (Teal/Green) -->
    <path d="M 40,68 L 72,50" stroke="#2DD4BF" stroke-width="18" stroke-linecap="round" />
    
    <!-- Left Edge (Indigo/Blue) -->
    <path d="M 40,32 L 40,68" stroke="#6366F1" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Typography matching the image -->
  <text x="105" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#374151" letter-spacing="-0.5px">
    Lumiere <tspan font-weight="500" fill="#8F00FF">AI</tspan>
  </text>
</svg>
